// Linux CI uses normal checkout paths; only override the generated app ABI filter.
gradle.beforeProject { p ->
    p.pluginManager.withPlugin('com.android.application') {
        p.extensions.getByName('androidComponents').finalizeDsl { android ->
            if (p.findProperty('reactNativeArchitectures') != 'arm64-v8a') {
                throw new GradleException('Cloud APK builds require arm64-v8a')
            }
            android.defaultConfig.ndk.abiFilters.clear()
            android.defaultConfig.ndk.abiFilters.add('arm64-v8a')
        }
    }
}
