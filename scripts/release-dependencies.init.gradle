import groovy.json.JsonOutput
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier

gradle.beforeProject { p ->
    p.pluginManager.withPlugin('com.android.application') {
        p.tasks.register('meloReleaseDependencyInventory') {
            doLast {
                def configuration = p.configurations.getByName('releaseRuntimeClasspath')
                // AGP project components expose several artifact variants (classes, assets,
                // metadata, JNI). Record their source project separately instead of making
                // an ambiguous artifact selection. Their transitive binaries remain in view.
                def artifacts = configuration.incoming.artifactView {
                    componentFilter { id -> !(id instanceof ProjectComponentIdentifier) }
                }.artifacts.artifacts
                def localProjects = configuration.incoming.resolutionResult.allComponents
                    .findAll { it.id instanceof ProjectComponentIdentifier && it.id.projectPath != p.path }
                    .collect { it.id.projectPath }.unique().sort()
                def entries = artifacts.collect { artifact ->
                    def digest = MessageDigest.getInstance('SHA-256')
                    artifact.file.withInputStream { stream ->
                        byte[] buffer = new byte[65536]
                        int count
                        while ((count = stream.read(buffer)) > 0) digest.update(buffer, 0, count)
                    }
                    def id = artifact.id.componentIdentifier
                    def coordinate = id instanceof ModuleComponentIdentifier
                        ? "${id.group}:${id.module}:${id.version}" : "file:${artifact.file.name}"
                    [coordinate: coordinate, type: artifact.file.name.tokenize('.').last(),
                     name: artifact.file.name, sha256: digest.digest().encodeHex().toString()]
                }.sort { a, b -> a.coordinate <=> b.coordinate ?: a.name <=> b.name }
                def report = p.file(p.findProperty('meloDependencyReport') ?: "${p.buildDir}/reports/melo-release-dependencies.json")
                report.parentFile.mkdirs()
                report.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                    configuration: 'releaseRuntimeClasspath', artifacts: entries, localProjects: localProjects
                ])) + '\n'
                p.logger.lifecycle("Recorded ${entries.size()} binary artifacts and ${localProjects.size()} source projects (no machine paths).")
            }
        }
    }
}
